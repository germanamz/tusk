name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Phase 1: when a release PR merges, create the GitHub release as a draft.
  # We deliberately skip the next-release-PR computation here: the draft has no
  # git tag yet (the tag is created atomically at publish time, below), and
  # release-please cannot anchor the next version without that tag — it would
  # fall back to scanning full history and mis-propose a major bump.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish:
    needs: create-release
    if: needs.create-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing (goreleaser signs:) and GitHub-native build
      # provenance both mint a short-lived OIDC token.
      id-token: write
      # actions/attest-build-provenance writes the attestation to the repo.
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # cosign signs checksums.txt (keyless); syft generates the per-archive
      # SBOMs. Both are invoked by goreleaser, so they must be on PATH first.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # release-please created the GitHub release as a draft, so the git tag
      # does not exist yet. Recreate it locally so goreleaser can derive the
      # version; the remote tag is created when we publish the draft below.
      - name: Recreate release tag locally
        run: git tag "${{ needs.create-release.outputs.tag_name }}" "${{ needs.create-release.outputs.sha }}"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for the release archives, verifiable with
      # `gh attestation verify <archive> --repo germanamz/tusk`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/tusk_*.tar.gz,dist/tusk_*.zip"

      # Attach binaries to the draft, then publish. We address the release by the
      # id embedded in upload_url rather than by tag: a draft release has no git
      # tag yet, and gh's tag-based lookups can't find it (cli/cli#5252).
      # Flipping draft=false creates the remote tag and makes the release public,
      # so the release, its tag, and its artifacts all go live together.
      - name: Attach binaries and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ needs.create-release.outputs.upload_url }}
        run: |
          set -euo pipefail
          upload_base="${UPLOAD_URL%\{*}"
          release_id="$(printf '%s' "$upload_base" | sed -E 's#.*/releases/([0-9]+)/assets#\1#')"
          for f in dist/tusk_*.tar.gz dist/tusk_*.zip dist/checksums.txt \
                   dist/checksums.txt.sig dist/checksums.txt.pem dist/*.sbom.json; do
            case "$f" in
              *.zip) ct=application/zip ;;
              *.tar.gz) ct=application/gzip ;;
              *.sbom.json) ct=application/json ;;
              *.sig|*.pem) ct=application/octet-stream ;;
              *) ct=text/plain ;;
            esac
            gh api --method POST "${upload_base}?name=$(basename "$f")" \
              -H "Content-Type: $ct" --input "$f"
          done
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -f make_latest=true

  # Phase 2: compute the next release PR. This runs after publish so that, on a
  # release-merge run, the just-published tag exists and release-please can
  # anchor on the real latest version. On ordinary pushes (publish skipped) the
  # previous release's tag is already present, so this still anchors correctly.
  next-pr:
    needs: [create-release, publish]
    if: ${{ always() && needs.create-release.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
