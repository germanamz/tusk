name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Pin the linter to a concrete release so a floating `latest` can't change
# findings (or break) with no code change. Must be a golangci-lint v2.x to
# match .golangci.yml's `version: "2"`. Bump here in one place.
env:
  GOLANGCI_LINT_VERSION: v2.10.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # Kept as a standalone job named `unit-tests` (NOT a matrix) because the branch
  # ruleset requires a status check by that exact name — a matrix would rename it
  # to `unit-tests (ubuntu-latest)` and the required check would never report.
  # macOS runs as the separate unit-tests-macos job below.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./internal/... ./cmd/...

  # macOS leg: exercises the OS-specific paths (flock advisory locking, fsnotify,
  # case-insensitive filesystem, the path-containment guard) that ubuntu-only CI
  # never ran. Not required by the ruleset yet — add `unit-tests-macos` to the
  # main ruleset's required checks to make it blocking.
  #
  # windows-latest is intentionally absent: adding it surfaced ~15 pre-existing
  # cross-platform failures (SQLite TempDir handle cleanup / "file in use" on
  # os.RemoveAll, file:// URL parsing of Windows paths where `C:` is read as
  # host:port, CRLF content-hash drift, an exec test missing the .exe suffix)
  # that need a dedicated Windows-hardening pass first.
  unit-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./internal/... ./cmd/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Run govulncheck
        run: govulncheck ./...

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Regenerate CLI docs
        run: go run ./cmd/tusk docgen man docs/cli

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- man docs/cli; then
            echo "::error::CLI docs are stale. Run 'make docs' and commit the result."
            git --no-pager diff -- man docs/cli
            exit 1
          fi

  # Dependabot web-deps PRs arrive stale here by construction (the bot can't
  # run `make web`); .github/workflows/dependabot-web-dist.yml rebuilds and
  # pushes the bundle onto those PR branches automatically.
  dist-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Build frontend
        run: make web
      - name: Fail on drift
        run: |
          # status --porcelain, not diff: a rebuild can ADD files, which
          # `git diff` (worktree vs index) never sees.
          if [ -n "$(git status --porcelain -- internal/graphview/dist)" ]; then
            echo "::error::internal/graphview/dist is stale. Run 'make web' and commit."
            git status --porcelain -- internal/graphview/dist
            git --no-pager diff -- internal/graphview/dist
            exit 1
          fi

  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Audit web dependencies
        working-directory: web
        # Audits the vendored frontend deps (bundled into the Go binary via
        # internal/graphview/dist). Reads the lockfile only — no install needed.
        #
        # BLOCKING: high+critical advisories fail the build (moderate/low are
        # surfaced in the log but non-blocking). The lockfile is clean as of the
        # web-deps bump; Dependabot keeps it current.
        run: pnpm audit --audit-level high

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
