name: CI

on:
  pull_request:
    # `edited` is intentionally absent. It fires on PR title/body edits, which
    # do NOT move the head commit, so re-running the heavy jobs here (macOS
    # tests, node builds, govulncheck) would burn minutes to reproduce results
    # that already stand for the unchanged SHA. The semantic-title check that
    # genuinely needs `edited` lives in its own lightweight pr-title.yml.
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# Supersede an in-flight run when a PR gets new commits: the older run's results
# no longer apply to the new head. Keyed on PR number, with the ref as a
# workflow_dispatch fallback, so runs across different PRs never cancel each
# other. Safe for required checks — cancellation only affects the stale head's
# runs; the new head gets a fresh, complete set.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: every job below only reads the checkout. The one job that
# needed pull-requests:read (the semantic PR-title check) now lives in
# pr-title.yml with its own scoped permissions.
permissions:
  contents: read

# Pin the linter to a concrete release so a floating `latest` can't change
# findings (or break) with no code change. Must be a golangci-lint v2.x to
# match .golangci.yml's `version: "2"`. Bump here in one place.
env:
  GOLANGCI_LINT_VERSION: v2.10.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # setup-go's built-in cache (keyed on go.sum) already covers
          # ~/go/pkg/mod and ~/.cache/go-build — the same paths a hand-rolled
          # actions/cache step used to manage. One source of caching, not two.
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # Kept as a standalone job named `unit-tests` (NOT a matrix) because the branch
  # ruleset requires a status check by that exact name — a matrix would rename it
  # to `unit-tests (ubuntu-latest)` and the required check would never report.
  # macOS runs as the separate unit-tests-macos job below.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./internal/... ./cmd/...

  # macOS leg: exercises the OS-specific paths (flock advisory locking, fsnotify,
  # case-insensitive filesystem, the path-containment guard) that ubuntu-only CI
  # never ran. Not required by the ruleset yet — add `unit-tests-macos` to the
  # main ruleset's required checks to make it blocking.
  #
  # windows-latest is intentionally absent: adding it surfaced ~15 pre-existing
  # cross-platform failures (SQLite TempDir handle cleanup / "file in use" on
  # os.RemoveAll, file:// URL parsing of Windows paths where `C:` is read as
  # host:port, CRLF content-hash drift, an exec test missing the .exe suffix)
  # that need a dedicated Windows-hardening pass first.
  unit-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./internal/... ./cmd/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Run govulncheck
        run: govulncheck ./...

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate CLI docs
        run: go run ./cmd/tusk docgen man docs/cli

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- man docs/cli; then
            echo "::error::CLI docs are stale. Run 'make docs' and commit the result."
            git --no-pager diff -- man docs/cli
            exit 1
          fi

  # Dependabot web-deps PRs arrive stale here by construction (the bot can't
  # run `make frontend`); .github/workflows/dependabot-frontend-dist.yml
  # rebuilds and pushes the bundle onto those PR branches automatically.
  dist-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Build frontend
        run: make frontend
      - name: Fail on drift
        run: |
          # status --porcelain, not diff: a rebuild can ADD files, which
          # `git diff` (worktree vs index) never sees.
          if [ -n "$(git status --porcelain -- internal/graphview/dist)" ]; then
            echo "::error::internal/graphview/dist is stale. Run 'make web' and commit."
            git status --porcelain -- internal/graphview/dist
            git --no-pager diff -- internal/graphview/dist
            exit 1
          fi
          if [ -n "$(git status --porcelain -- internal/bookview/dist)" ]; then
            echo "::error::internal/bookview/dist is stale. Run 'make web-book' and commit."
            git status --porcelain -- internal/bookview/dist
            git --no-pager diff -- internal/bookview/dist
            exit 1
          fi

  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      # Audits BOTH vendored frontends — web (bundled into
      # internal/graphview/dist) and web-book (internal/bookview/dist). Reads
      # the lockfile only; no install needed.
      #
      # BLOCKING: high+critical advisories fail the build (moderate/low are
      # surfaced in the log but non-blocking). Both lockfiles are clean as of
      # this change; Dependabot's web-deps and book-web-deps groups keep them
      # current.
      - name: Audit web (graph) dependencies
        working-directory: web
        run: pnpm audit --audit-level high
      - name: Audit web-book dependencies
        working-directory: web-book
        run: pnpm audit --audit-level high

  # Gates web-book's vitest suite. web/ has no equivalent job — the graph
  # frontend's only CI gates are dist-drift (a build) and web-audit (a lockfile
  # audit), so this is the first job in the repo that runs frontend tests.
  #
  # Playwright e2e (web-book/e2e, `pnpm e2e`) is deliberately NOT run here: it
  # needs a built Go binary, a fixture vault, and a browser download. It stays a
  # local gate.
  web-book-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web-book/.nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Install dependencies
        working-directory: web-book
        run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: web-book
        run: pnpm test
