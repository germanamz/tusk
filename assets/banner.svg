<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="tusk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="900" height="3" rx="0" fill="url(#accent)"/>

  <!-- Tusk icon (stylized tusk/fang shape) -->
  <g transform="translate(160, 60)" filter="url(#glow)">
    <!-- Left tusk -->
    <path d="M 60 10 Q 55 80, 30 150 Q 28 158, 32 160 Q 38 162, 42 155 Q 62 95, 72 30 Z" fill="url(#tusk-grad)" opacity="0.9"/>
    <!-- Right tusk -->
    <path d="M 80 10 Q 85 80, 110 150 Q 112 158, 108 160 Q 102 162, 98 155 Q 78 95, 68 30 Z" fill="url(#tusk-grad)" opacity="0.9"/>
    <!-- Bridge -->
    <ellipse cx="70" cy="18" rx="22" ry="14" fill="url(#tusk-grad)" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="340" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#f8fafc">tusk</text>

  <!-- Tagline -->
  <text x="340" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Concurrent-safe task management CLI with MCP server</text>

  <!-- Badges row -->
  <g transform="translate(340, 180)">
    <!-- Go badge -->
    <rect x="0" y="0" width="50" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Go</text>

    <!-- SQLite badge -->
    <rect x="60" y="0" width="64" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="92" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">SQLite</text>

    <!-- MCP badge -->
    <rect x="134" y="0" width="52" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="160" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">MCP</text>

    <!-- Apache 2.0 badge -->
    <rect x="196" y="0" width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="241" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Apache 2.0</text>
  </g>

  <!-- Terminal snippet decoration -->
  <g transform="translate(340, 222)">
    <text font-family="ui-monospace, monospace" font-size="13" fill="#475569">$</text>
    <text x="16" font-family="ui-monospace, monospace" font-size="13" fill="#38bdf8">tusk add</text>
    <text x="88" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">"Ship it"</text>
    <text x="160" font-family="ui-monospace, monospace" font-size="13" fill="#818cf8">priority:4</text>
    <text x="252" font-family="ui-monospace, monospace" font-size="13" fill="#4ade80">+release</text>
  </g>
</svg>
