<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tusk graph</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #e6e6e6; font: 14px system-ui, sans-serif; }
      /* #main-area fills the entire viewport. #controls overlays the left edge
         as a position:absolute drawer; #panel is a fixed-width right column. */
      body { display: flex; flex-direction: column; }
      #search-form { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #2a2d3a; }
      #search {
        background: #1e2130; border: 1px solid #2a2d3a; color: #e6e6e6;
        padding: 3px 8px; border-radius: 4px; font-size: 13px; width: 100%;
        box-sizing: border-box;
      }
      #search::placeholder { color: #666; }
      #search-form button {
        background: #1e2130; border: 1px solid #2a2d3a; color: #e6e6e6;
        padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
        white-space: nowrap; flex-shrink: 0;
      }
      #search-form button:hover { background: #2a2d3a; }
      /* Alert overlays float over the graph area. */
      #search-msg {
        display: none; position: absolute; top: 8px; right: 12px; z-index: 20;
        background: rgba(30,33,48,0.95); border: 1px solid #f5a623;
        color: #f5a623; padding: 6px 12px; border-radius: 4px; font-size: 12px;
        max-width: 360px;
      }
      #banner {
        display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
        z-index: 20; background: rgba(30,33,48,0.95); border: 1px solid #f0c040;
        color: #f0c040; padding: 6px 16px; border-radius: 4px; font-size: 13px;
        pointer-events: none;
      }
      /* Layout-status overlay — same centered-top style as #banner but a distinct
         blue accent. Toggled by main.ts while the semantic-layout worker runs.
         Separate element from #banner (which is the >5000-node scale guard). */
      #layout-status {
        display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
        z-index: 20; background: rgba(30,33,48,0.95); border: 1px solid #4f8cff;
        color: #4f8cff; padding: 6px 16px; border-radius: 4px; font-size: 13px;
        pointer-events: none;
      }
      /* Connection-status pill — same overlay style as #banner/#layout-status but
         pinned bottom-center with a RED accent so an SSE drop reads as an alert and
         never collides with the top-center pills. Toggled by main.ts. */
      #conn-status {
        display: none; position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
        z-index: 20; background: rgba(30,33,48,0.95); border: 1px solid #f04438;
        color: #f04438; padding: 6px 16px; border-radius: 4px; font-size: 13px;
        pointer-events: none;
      }
      #main-area { position: relative; display: flex; flex: 1; min-height: 0; }
      /* min-width:0 lets this flex child shrink below the canvas size so the
         320px panel keeps its place; without it the canvas pushes the panel
         off-screen (flex items default to min-width:auto). Height comes from
         the flex row, so the canvas (sized to this element) tracks it exactly. */
      #graph { flex: 1; min-width: 0; }
      #panel {
        width: 320px; flex-shrink: 0; overflow: hidden auto;
        background: #12151f; border-left: 1px solid #2a2d3a;
        padding: 12px; box-sizing: border-box;
      }
      #panel h2 { margin: 0 0 4px; font-size: 16px; }
      #panel h3 { margin: 12px 0 6px; font-size: 13px; color: #aaa; }
      #panel pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #c9d1d9; }
      #panel button {
        display: block; width: 100%; text-align: left; margin: 2px 0;
        background: #1e2130; border: 1px solid #2a2d3a; color: #e6e6e6;
        padding: 4px 8px; border-radius: 4px; cursor: pointer;
      }
      #panel button:hover { background: #2a2d3a; }

      /* ------------------------------------------------------------------ */
      /* #controls — collapsible left drawer                                 */
      /* ------------------------------------------------------------------ */
      #controls {
        /* Anchored inside #main-area (position:relative). Overlays the left
           edge of the canvas. */
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 220px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        background: rgba(11,14,20,0.85);
        border-right: 1px solid #2a2d3a;
        font-size: 12px;
        color: #e6e6e6;
        transition: width 0.15s ease;
      }

      /* Collapsed: shrink to a thin tab showing only the ≡ toggle button */
      #controls.collapsed {
        width: 28px;
        overflow: hidden;
      }
      #controls.collapsed .controls-body,
      #controls.collapsed .controls-footer,
      #controls.collapsed #search-form {
        display: none;
      }
      #controls.collapsed .controls-collapse-btn {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        padding: 8px 4px;
        width: 28px;
        height: auto;
        border-radius: 0;
      }

      .controls-header {
        flex: 0 0 auto;
        border-bottom: 1px solid #2a2d3a;
      }

      .controls-collapse-btn {
        display: block;
        width: 100%;
        background: transparent;
        border: none;
        color: #e6e6e6;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 10px;
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
      }
      .controls-collapse-btn:hover { background: rgba(255,255,255,0.05); }

      /* Body: fills available vertical space, contains the scrollable list */
      .controls-body {
        flex: 1 1 auto;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .controls-group-header {
        flex: 0 0 auto;
        padding: 6px 10px 4px;
        font-size: 11px;
        color: #aaa;
        border-bottom: 1px solid #2a2d3a;
      }

      .controls-group-search {
        flex: 0 0 auto;
        margin: 6px 8px 4px;
        background: #1e2130;
        border: 1px solid #2a2d3a;
        color: #e6e6e6;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        width: calc(100% - 16px);
        box-sizing: border-box;
      }
      .controls-group-search::placeholder { color: #666; }

      .controls-bulk {
        flex: 0 0 auto;
        display: flex;
        gap: 4px;
        padding: 4px 8px;
        border-bottom: 1px solid #2a2d3a;
      }
      .controls-bulk button {
        flex: 1;
        background: #1e2130;
        border: 1px solid #2a2d3a;
        color: #e6e6e6;
        padding: 2px 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
      }
      .controls-bulk button:hover { background: #2a2d3a; }

      /* Scrollable group list */
      .controls-group-list {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 0;
      }
      .controls-group-list::-webkit-scrollbar { width: 4px; }
      .controls-group-list::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 2px; }

      /* Individual group row */
      .controls-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        cursor: default;
        white-space: nowrap;
        overflow: hidden;
      }
      .controls-row:hover { background: rgba(255,255,255,0.04); }
      .controls-row input[type="checkbox"] { flex: 0 0 auto; cursor: pointer; accent-color: #4f8cff; }

      .controls-swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 auto;
      }

      .controls-row-label {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
      }

      .controls-row-count {
        flex: 0 0 auto;
        color: #888;
        font-size: 11px;
        min-width: 24px;
        text-align: right;
      }

      .controls-solo-btn {
        flex: 0 0 auto;
        background: transparent;
        border: none;
        color: #888;
        font-size: 13px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        border-radius: 3px;
      }
      .controls-solo-btn:hover { color: #e6e6e6; background: rgba(255,255,255,0.08); }

      /* Filters disclosure section */
      .controls-filters-section {
        flex: 0 0 auto;
        border-top: 1px solid #2a2d3a;
      }

      .controls-filters-toggle {
        display: block;
        width: 100%;
        background: transparent;
        border: none;
        color: #aaa;
        font-size: 11px;
        padding: 5px 10px;
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
      }
      .controls-filters-toggle:hover { background: rgba(255,255,255,0.04); color: #e6e6e6; }

      .controls-filters-body {
        padding: 2px 0 4px;
      }

      .controls-filter-subheader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 8px 2px;
        font-size: 10px;
        color: #888;
        border-top: 1px solid #1a1d28;
      }
      .controls-filter-subheader:first-child { border-top: none; }

      .controls-filter-bulk {
        display: flex;
        gap: 3px;
      }
      .controls-filter-bulk button {
        background: #1e2130;
        border: 1px solid #2a2d3a;
        color: #e6e6e6;
        padding: 1px 5px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 10px;
      }
      .controls-filter-bulk button:hover { background: #2a2d3a; }

      .controls-filter-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 10px;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
      }
      .controls-filter-row:hover { background: rgba(255,255,255,0.04); }
      .controls-filter-row input[type="checkbox"] { flex: 0 0 auto; cursor: pointer; accent-color: #4f8cff; }

      /* Footer: fixed below the scroll list, never scrolls away */
      .controls-footer {
        flex: 0 0 auto;
        border-top: 1px solid #2a2d3a;
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
      }

      .controls-footer strong {
        font-size: 11px;
        color: #aaa;
      }

      .controls-footer-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 8px;
      }

      .controls-footer-hint {
        color: #666;
        display: block;
      }

      /* Layout toggle (Structure / Semantic) — a small segmented radio group
         in the footer, set off from the content above by a thin divider. */
      .controls-layout-group {
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid #2a2d3a;
      }
      .controls-layout-options {
        display: flex;
        gap: 12px;
        margin: 2px 0;
      }
      .controls-layout-option {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 11px;
        color: #e6e6e6;
      }
      .controls-layout-option input[type="radio"] { cursor: pointer; accent-color: #4f8cff; }
      .controls-layout-option.disabled { color: #555; cursor: not-allowed; }
      .controls-layout-option.disabled input[type="radio"] { cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="main-area">
      <!-- Left controls drawer: built once by controls.ts, diff-updated on each
           snapshot. Inside #main-area (position:relative) so the drawer fills
           the full viewport height; position:absolute keeps it out of the flex
           flow. The static #search-form scaffold lives here so it is never
           wiped by a container innerHTML-clear. controls.ts moves it into the
           drawer header on boot. -->
      <div id="controls">
        <form id="search-form">
          <input id="search" type="search" placeholder="search nodes…" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
      </div>
      <div id="search-msg"></div>
      <div id="banner">large graph — apply a filter</div>
      <div id="layout-status">computing layout…</div>
      <div id="conn-status"></div>
      <div id="graph"></div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
