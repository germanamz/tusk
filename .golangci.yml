version: "2"

linters:
  enable:
    - varnamelen
  settings:
    varnamelen:
      min-name-length: 2
      check-receiver: true
      check-return: true
      check-type-param: true
      ignore-names: []
      ignore-decls: []
  exclusions:
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [errcheck]
        text: 'Error return value of `.*\.Close` is not checked'
      # varnamelen full-codebase exclusions — each package's rule is removed
      # by its corresponding sweep phase (3–7); any residual rules are
      # removed in Phase 8.
      - linters: [varnamelen]
        path: ^filter/
      - linters: [varnamelen]
        path: ^domain/
      - linters: [varnamelen]
        path: ^syntax/
      - linters: [varnamelen]
        path: ^repository/
      - linters: [varnamelen]
        path: ^sqlite/
      - linters: [varnamelen]
        path: ^cmd/
      - linters: [varnamelen]
        path: ^tests/e2e/
      - linters: [varnamelen]
        path: ^client\.go$
      # config/ omitted from the spec's enumeration; tracked as a follow-up
      # sweep (tusk task 06fa0f50) and removed by that task.
      - linters: [varnamelen]
        path: ^config/
