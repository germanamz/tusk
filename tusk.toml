# Tusk workspace config for the tusk repo itself.
#
# Resolved by tusk's walk-up config discovery (v0.9): any `tusk` command
# run from anywhere inside this checkout uses this file as its active
# config, and `storage.path` resolves relative to this file's directory.
#
# Net effect: `tusk task list` (or any tusk subcommand) operates on
# `.data/tusk.db` without TUSK_DB or `--config` flags. CI does the same.

[storage]
path = ".data/tusk.db"
