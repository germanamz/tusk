# Tusk Configuration
#
# Place this file at ~/.config/tusk/config.toml
# All values shown below are the defaults — you only need to
# include settings you want to override.
#
# Every key can also be set via environment variable with the
# TUSK_ prefix. Nesting uses underscores:
#   storage.path       → TUSK_STORAGE_PATH
#   tui.color          → TUSK_TUI_COLOR
#   urgency.due_weight → TUSK_URGENCY_DUE_WEIGHT

[storage]
backend = "sqlite"                         # "sqlite" (only supported backend currently)
path    = "~/.local/share/tusk/tusk.db"    # SQLite database file path

[storage.postgres]
dsn = ""  # PostgreSQL connection string (future use)

[urgency]
priority_weight    = 6.0    # Weight for task priority in urgency score
due_weight         = 12.0   # Weight for due date proximity
age_weight         = 2.0    # Weight for task age
active_weight      = 4.0    # Weight for active status
blocking_weight    = 8.0    # Weight for tasks that block others
blocked_weight     = -5.0   # Weight for tasks that are blocked
tags_weight        = 1.0    # Weight for tag count
project_weight     = 1.0    # Weight for having a project
annotations_weight = 1.0    # Weight for annotation count
waiting_weight     = -3.0   # Weight for waiting tasks

[tui]
date_format  = "2006-01-02"  # Go time format for date display
color        = true           # Enable colored output (respects NO_COLOR)
tree_indent  = 2              # Spaces per indent level in tree view
default_sort = "urgency"      # Default sort field for task lists

[mcp]
# Disable MCP tool groups: ["task", "task_relations", "project", "workflow", "player", "config"]
disabled_tool_groups = []

# Workspace-shaping tools are blocked for MCP agents by default. Remove
# entries to opt in; combine with [mcp.blocked_fields] for field-level policy.
disabled_tools = [
  "tusk_config_set",
  "tusk_workflow_create",
  "tusk_workflow_modify",
  "tusk_workflow_delete",
  "tusk_project_create",
  "tusk_project_modify",
  "tusk_project_delete",
]

# Disable MCP resource groups: ["task", "project", "workflow"]
disabled_resource_groups = []

# Disable individual MCP resources by URI template, e.g.:
# disabled_resources = ["tusk://projects/{name}/workflow"]
disabled_resources = []

# Field-level write restrictions. Keys are MCP tool names, values are the
# input fields an agent may not supply. Enforced only when the tool is
# enabled (i.e., not listed in disabled_tools above).
[mcp.blocked_fields]
tusk_project_modify = ["workflow"]
tusk_project_delete = ["force"]

[inline]
# Maximum byte size of a single @file expansion on inline string fields.
# Applied per reference, not per invocation — three 900 KB expansions in
# one description are allowed under the default.
max_expansion_size = 1048576

[notes]
window_size = 20  # Default trailing window size for note listings
