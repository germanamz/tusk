version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tusk
    binary: tusk
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/germanamz/tusk/internal/version.Current=v{{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Specifying `files` replaces goreleaser's defaults, so re-list the docs we
    # still want alongside the man pages install.sh extracts.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - man/*.1
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# One SPDX-JSON SBOM per archive (syft). Lands in dist/ as
# <archive>.sbom.json and is uploaded to the release alongside the archives.
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt. checksums.txt enumerates every
# archive + SBOM hash, so one transparency-logged signature transitively
# protects all artifacts. Keyless uses the publish job's GitHub OIDC token
# (Fulcio/Rekor public-good infra) — no private key to manage, but the signing
# identity is recorded in the public Rekor transparency log. The signature,
# certificate and Rekor inclusion proof all live in one Sigstore bundle —
# cosign v3 deprecated the split --output-signature/--output-certificate pair.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/germanamz/tusk/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^feat'
    - title: Bug Fixes
      regexp: '^fix'
    - title: Others
      order: 999

# The GitHub release is owned by release-please; this workflow runs goreleaser
# with --skip=publish and uploads dist/* to that release. Disabled here so a
# manual `goreleaser release` never creates a competing release.
release:
  disable: true
