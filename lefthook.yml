pre-commit:
  parallel: true
  commands:
    branch-name:
      # Validate branch naming early. Lives in pre-commit (not pre-push)
      # because lefthook silently skips pre-push commands when the
      # computed push-file set is empty (e.g. deletion-only or no-op
      # pushes), which let a non-conforming branch name slip past until
      # CI rejected it.
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ] || [ "$branch" = "v1" ]; then
          exit 0
        fi
        if ! echo "$branch" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$'; then
          echo "Branch name '$branch' does not match required pattern: <type>/<kebab-case-description>"
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "Example: feat/add-filters, fix/null-pointer"
          exit 1
        fi
    gofmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"
      fail_text: "Run 'gofmt -w .' to fix formatting"
    vet:
      glob: "*.go"
      run: |
        pkgs=$(go list ./... 2>/dev/null)
        [ -z "$pkgs" ] && exit 0
        go vet $pkgs
    lint:
      glob: "*.go"
      run: |
        pkgs=$(go list ./... 2>/dev/null)
        [ -z "$pkgs" ] && exit 0
        golangci-lint run ./...
    test:
      glob: "*.go"
      run: |
        pkgs=$(go list ./... 2>/dev/null)
        [ -z "$pkgs" ] && exit 0
        go test $pkgs
