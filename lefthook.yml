pre-commit:
  parallel: true
  commands:
    branch-name:
      # Validate branch naming early. Lives in pre-commit (not pre-push)
      # because lefthook silently skips pre-push commands when the
      # computed push-file set is empty (e.g. deletion-only or no-op
      # pushes), which let a non-conforming branch name slip past until
      # CI rejected it.
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ] || [ "$branch" = "v1" ]; then
          exit 0
        fi
        # Machine-generated branch names (dependabot uses underscores) are
        # exempt — the convention exists for human branches. Needed when
        # committing a dist rebuild onto a checked-out dependabot PR.
        case "$branch" in dependabot/*) exit 0 ;; esac
        if ! echo "$branch" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$'; then
          echo "Branch name '$branch' does not match required pattern: <type>/<kebab-case-description>"
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "Example: feat/add-filters, fix/null-pointer"
          exit 1
        fi
    gofmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"
      fail_text: "Run 'gofmt -w .' to fix formatting"
    vet:
      glob: "*.go"
      run: |
        pkgs=$(go list ./... 2>/dev/null)
        [ -z "$pkgs" ] && exit 0
        go vet $pkgs
    lint:
      glob: "*.go"
      run: |
        pkgs=$(go list ./... 2>/dev/null)
        [ -z "$pkgs" ] && exit 0
        golangci-lint run ./...
    test:
      glob: "*.go"
      run: |
        pkgs=$(go list ./... 2>/dev/null)
        [ -z "$pkgs" ] && exit 0
        go test $pkgs

pre-push:
  parallel: false
  commands:
    docs-drift:
      # Regenerate CLI docs and fail if anything changed. The man and
      # markdown trees are checked in, so any edit to Cobra help strings
      # must be accompanied by their regenerated artifacts.
      run: |
        go run ./cmd/tusk docgen man docs/cli
        if ! git diff --quiet -- man docs/cli; then
          echo "tusk docgen produced changes. Run 'make docs' and commit the result."
          git --no-pager diff --stat -- man docs/cli
          exit 1
        fi
    frontend-dist-drift:
      # status --porcelain, not diff: a rebuild can ADD files, which
      # `git diff` (worktree vs index) never sees.
      #
      # No `glob:` here — this hook has none, so it runs on every push
      # regardless of what changed. `make frontend` builds every committed
      # frontend dist (web + web-book) in one shot, so both are checked
      # here rather than adding a second hook.
      run: |
        make frontend
        if [ -n "$(git status --porcelain -- internal/graphview/dist)" ]; then
          echo "internal/graphview/dist is stale. Run 'make web' and commit it."
          git status --porcelain -- internal/graphview/dist
          exit 1
        fi
        if [ -n "$(git status --porcelain -- internal/bookview/dist)" ]; then
          echo "internal/bookview/dist is stale. Run 'make web-book' and commit it."
          git status --porcelain -- internal/bookview/dist
          exit 1
        fi
